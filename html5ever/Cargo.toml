[package]
name = "html5ever"
description = "High-performance browser-grade HTML5 parser"
documentation = "https://docs.rs/html5ever"
categories = [ "parser-implementations", "web-programming" ]
keywords = ["html", "html5", "parser", "parsing"]
readme = "../README.md"
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
trace_tokenizer = []
serde = ["markup5ever/serde"]

[dependencies]
# From the registry, so that a project patching html5ever from git keeps the
# released markup5ever, tendril and web_atoms; this workspace patches it back.
markup5ever = "0.39"
log = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
typed-arena = { workspace = true }

[[bench]]
name = "html5ever"
harness = false
